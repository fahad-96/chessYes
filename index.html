<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1419" />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="Kibitz is a free, open-source chess game review. Stockfish runs in your browser: move classifications, accuracy, eval graph and plain-English explanations."
    />
    <title>Kibitz · Free chess game review</title>
    <script>
      // Apply the saved theme before the app loads so a forced light or dark theme never
      // flashes. Mirrors useDocumentTheme in src/app/Layout.tsx (store: src/state/settings.ts).
      try {
        const saved = JSON.parse(localStorage.getItem('kibitz-settings') || '{}').state || {};
        const root = document.documentElement;
        if (saved.theme === 'light' || saved.theme === 'dark') root.dataset.theme = saved.theme;
        if (typeof saved.boardTheme === 'string') root.dataset.board = saved.boardTheme;
      } catch {
        // Storage blocked or unreadable: the app applies the theme once it starts.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
